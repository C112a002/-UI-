<style>
#ufs-btn{position:fixed;right:14px;bottom:14px;z-index:45;display:flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid #2A3F58;border-radius:4px;background:#0A1420;color:#38F2C8;font:600 11px/1 system-ui,sans-serif;letter-spacing:.06em;cursor:pointer}
#ufs-btn:hover{border-color:#38F2C8}
#ufs-panel{position:fixed;right:14px;bottom:54px;z-index:45;width:min(320px,calc(100vw - 28px));max-height:60vh;display:none;flex-direction:column;border:1px solid #2A3F58;border-radius:4px;background:#0C1523;color:#CFE3F2;font:12px/1.4 system-ui,sans-serif;box-shadow:0 18px 40px rgba(0,0,0,.75)}
#ufs-panel.open{display:flex}
#ufs-panel header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #16243A}
#ufs-panel button{cursor:pointer;border:1px solid #22344B;border-radius:3px;background:transparent;color:#8FA9C2;padding:4px 8px;font:inherit}
#ufs-panel button:hover{border-color:#38F2C8;color:#38F2C8}
#ufs-list{overflow:auto;padding:6px 12px 10px}
.ufs-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #122034}
.ufs-row div{min-width:0;flex:1}
.ufs-row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:#E8F6FF}
.ufs-row small{color:#5E7A96}
</style>
<script>
(()=>{
const DOC='uiforge.doc.v1',KEY='uiforge.snapshots.v1',MAX=20,MAX_AUTO=8;
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}};
const save=l=>{while(true){try{localStorage.setItem(KEY,JSON.stringify(l));return true}catch{if(!l.length)return false;l.pop()}}};
const meta=raw=>{try{const d=JSON.parse(raw);return{name:d.name||'未命名',n:(d.elements||[]).length}}catch{return{name:'未命名',n:0}}};
const fmt=t=>new Date(t).toLocaleString('zh-TW',{hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
function add(label,auto){
  const raw=localStorage.getItem(DOC);if(!raw)return false;
  const l=load();if(l[0]&&l[0].raw===raw)return false;
  const m=meta(raw);l.unshift({t:Date.now(),label,auto:!!auto,name:m.name,n:m.n,raw});
  let a=0;return save(l.filter(x=>!x.auto||++a<=MAX_AUTO).slice(0,MAX));
}
const h=(tag,txt,attrs)=>{const e=document.createElement(tag);if(txt!=null)e.textContent=txt;Object.assign(e,attrs||{});return e};
const btn=h('button','⏱ 快照',{id:'ufs-btn',type:'button',title:'版本快照：儲存 / 還原設計進度'});
const panel=h('div',null,{id:'ufs-panel'});
const list=h('div',null,{id:'ufs-list'});
const saveBtn=h('button','＋ 儲存快照',{type:'button'});
const head=h('header');head.append(h('strong','版本快照'),saveBtn);
panel.append(head,list);
function render(){
  list.textContent='';
  const l=load();
  if(!l.length){list.append(h('p','尚無快照。系統每 3 分鐘會在內容變動時自動留存。',{style:'color:#5E7A96'}));return}
  l.forEach((s,i)=>{
    const row=h('div',null,{className:'ufs-row'});
    const info=h('div');
    info.append(h('b',s.label||s.name),h('small',fmt(s.t)+' · '+s.n+' 個元件'+(s.auto?' · 自動':'')));
    const re=h('button','還原',{type:'button'}),del=h('button','✕',{type:'button',title:'刪除'});
    re.onclick=()=>{
      if(!confirm('還原此快照？目前的設計會先自動備份一份。'))return;
      add('還原前備份',true);
      const cur=load()[0]&&load().find(x=>x.t===s.t);
      try{localStorage.setItem(DOC,(cur||s).raw)}catch{alert('還原失敗');return}
      location.reload();
    };
    del.onclick=()=>{const all=load();all.splice(all.findIndex(x=>x.t===s.t),1);save(all);render()};
    row.append(info,re,del);list.append(row);
  });
}
saveBtn.onclick=()=>{
  const name=prompt('快照名稱（可留白）',fmt(Date.now()));
  if(name===null)return;
  setTimeout(()=>{add(name||'手動快照',false)?render():alert('設計沒有變動或儲存空間不足');},600);
};
btn.onclick=()=>{panel.classList.toggle('open');render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')panel.classList.remove('open')});
document.addEventListener('pointerdown',e=>{if(!panel.contains(e.target)&&e.target!==btn)panel.classList.remove('open')});
document.body.append(panel,btn);
setInterval(()=>add('自動快照',true),180000);
})();
</script>
</body>
